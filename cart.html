<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Cart - Maruti Electrical</title><meta name="description" content="Review your cart and place order on WhatsApp."><meta name="theme-color" content="#FF4B00">
<link rel="icon" href="images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head><body>
<div id="site-header"></div>

<div class="phead"><div class="container position-relative" style="z-index:2"><div class="crumb"><a href="index.html">Home</a> / Cart</div><h1>My Cart</h1></div></div>
<section class="sec" style="padding-top:28px"><div class="container" id="cartWrap"></div></section>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>

function render(){
 const l=Cart.lines(),w=$('#cartWrap');
 if(!l.length){w.innerHTML='<div class="empty"><i class="fa-solid fa-cart-shopping d-block"></i><h4>Your cart is empty</h4><p>Add some products to place an order.</p><a href="shop.html" class="btn btn-flame">Start shopping</a></div>';return}
 const t=Cart.totals(),need=Math.max(0,SITE.freeDeliveryAbove-t.sub);
 w.innerHTML=`<div class="row g-4"><div class="col-lg-8">
 <div class="d-flex justify-content-between align-items-center mb-3"><b>${l.length} item(s) in cart</b><button class="rm btn btn-sm p-0 text-danger fw-semibold" id="clr">Clear cart</button></div>
 ${l.map(i=>`<div class="citem"><a href="product.html?id=${i.id}"><img src="${img(i.p.imgs[0])}" alt=""></a><div class="flex-grow-1 d-flex flex-column"><a href="product.html?id=${i.id}"><h3>${i.p.name}</h3></a>
 <div class="pr"><b>${inr(i.p.price)}</b><s>${inr(i.p.mrp)}</s></div>
 <div class="d-flex justify-content-between align-items-center mt-auto pt-2"><div class="qty"><button data-m="${i.id}" aria-label="Decrease"><i class="fa-solid fa-minus"></i></button><span>${i.qty}</span><button data-p="${i.id}" aria-label="Increase"><i class="fa-solid fa-plus"></i></button></div>
 <div class="text-end"><b>${inr(i.p.price*i.qty)}</b><br><button class="rm" data-r="${i.id}"><i class="fa-regular fa-trash-can me-1"></i>Remove</button></div></div></div></div>`).join('')}</div>
 <div class="col-lg-4"><div class="sum"><h5 class="fw-bold mb-3">Order Summary</h5>
 <div class="row-s"><span>Price (${Cart.count()} items)</span><span>${inr(t.mrp)}</span></div>
 <div class="row-s"><span>Discount</span><span class="sv">- ${inr(t.save)}</span></div>
 <div class="row-s"><span>Delivery</span><span class="${t.ship?'':'sv'}">${t.ship?inr(t.ship):'FREE'}</span></div>
 <div class="row-s tot"><span>Total</span><span>${inr(t.total)}</span></div>
 <div class="sv small mt-2">You save ${inr(t.save)} on this order</div>
 <div class="small text-muted mt-3">${need?`Add ${inr(need)} more for free delivery`:'You get free delivery!'}</div><div class="ship-bar"><i style="width:${Math.min(100,t.sub/SITE.freeDeliveryAbove*100)}%"></i></div>
 <hr><h6 class="fw-bold">Your Details</h6>
 <input class="form-control mb-2" id="cn" placeholder="Full name *" autocomplete="name"><input class="form-control mb-2" id="cp" type="tel" inputmode="numeric" placeholder="Mobile number *" maxlength="10" autocomplete="tel">
 <textarea class="form-control mb-2" id="ca" rows="2" placeholder="Delivery address *" autocomplete="street-address"></textarea><input class="form-control mb-3" id="cno" placeholder="Note (optional)">
 <button class="btn btn-wa w-100 btn-lg" id="place"><i class="fa-brands fa-whatsapp me-2"></i>Place Order on WhatsApp</button>
 <p class="small text-muted text-center mt-2 mb-0">Your order will open in WhatsApp with all selected products.</p></div></div></div>`;
}
document.addEventListener('click',e=>{
 const g=a=>e.target.closest('['+a+']')?.getAttribute(a);let id;
 if(id=g('data-p'))Cart.set(id,Cart.get().find(x=>x.id===id).qty+1),render();
 else if(id=g('data-m'))Cart.set(id,Cart.get().find(x=>x.id===id).qty-1),render();
 else if(id=g('data-r'))Cart.set(id,0),render(),toast('Item removed','fa-trash');
 else if(e.target.closest('#clr')){if(confirm('Remove all items from cart?')){Cart.clear();render()}}
 else if(e.target.closest('#place')){
  const c={name:$('#cn').value.trim(),phone:$('#cp').value.trim(),address:$('#ca').value.trim(),note:$('#cno').value.trim()};
  if(!c.name||!/^[6-9]\d{9}$/.test(c.phone)||!c.address){toast('Please enter name, valid 10-digit mobile & address','fa-triangle-exclamation');(!c.name?$('#cn'):!/^[6-9]\d{9}$/.test(c.phone)?$('#cp'):$('#ca')).focus();return}
  window.open(waOrder(c),'_blank');
 }});
render();
</script></body></html>
