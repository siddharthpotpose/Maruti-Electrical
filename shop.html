<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop - Maruti Electrical</title><meta name="description" content="Browse all switches, sockets, regulators and LED lights."><meta name="theme-color" content="#FF4B00">
<link rel="icon" href="images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head><body>
<div id="site-header"></div> 

<div class="phead"><div class="container position-relative" style="z-index:2"><div class="crumb"><a href="index.html">Home</a> / Shop</div><h1 id="shTitle">All Products</h1><p id="shSub"></p></div></div>
<section class="sec" style="padding-top:24px"><div class="container">
<div class="chips" id="chips"></div>
<div class="sortbar"><span class="text-muted" id="cnt"></span><select id="sort" class="form-select form-select-sm"><option value="p">Popularity</option><option value="lh">Price: Low to High</option><option value="hl">Price: High to Low</option><option value="r">Top Rated</option></select></div>
<div class="row g-2 g-md-3" id="grid"></div></div></section>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>

const u=new URLSearchParams(location.search);let cat=u.get('cat')||'all',q=(u.get('q')||'').toLowerCase();
const chips=[{id:'all',name:'All'},...CATEGORIES];
function draw(){
 $('#chips').innerHTML=chips.map(c=>`<button class="chip ${c.id===cat?'on':''}" data-c="${c.id}">${c.name}</button>`).join('');
 let l=PRODUCTS.filter(p=>(cat==='all'||p.cat===cat)&&(!q||(p.name+p.short+p.cat).toLowerCase().includes(q)));
 const s=$('#sort').value;l.sort((a,b)=>s==='lh'?a.price-b.price:s==='hl'?b.price-a.price:s==='r'?b.rating-a.rating:b.reviews-a.reviews);
 $('#cnt').textContent=l.length+' products';
 $('#shTitle').textContent=q?'Results for "'+u.get('q')+'"':(cat==='all'?'All Products':chips.find(c=>c.id===cat).name);
 $('#grid').innerHTML=l.length?l.map(card).join(''):'<div class="empty w-100"><i class="fa-solid fa-box-open d-block"></i><h5>No products found</h5><a href="shop.html" class="btn btn-flame mt-2">View all products</a></div>';
}
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;q='';history.replaceState(null,'','shop.html'+(cat==='all'?'':'?cat='+cat));draw()});
$('#sort').addEventListener('change',draw);draw();

</script></body></html>
