<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Product - Maruti Electrical</title><meta name="description" content="Product details"><meta name="theme-color" content="#FF4B00">
<link rel="icon" href="images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head><body>
<div id="site-header"></div>

<div class="container pt-3"><div class="crumb text-muted"><a href="index.html">Home</a> / <a href="shop.html">Shop</a> / <span id="bc"></span></div></div>
<section class="sec" style="padding-top:16px" id="pdWrap"></section>
<section class="sec sec-soft"><div class="container"><div class="sec-head"><div><h2>You may also like</h2></div></div><div class="row g-2 g-md-3" id="rel"></div></div></section>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>

const p=getP(new URLSearchParams(location.search).get('id'));
if(!p){$('#pdWrap').innerHTML='<div class="empty"><i class="fa-solid fa-box-open d-block"></i><h4>Product not found</h4><a href="shop.html" class="btn btn-flame mt-2">Back to shop</a></div>';$('#rel').parentElement.remove()}
else{
document.title=p.name+' - Maruti Electrical';$('#bc').textContent=p.name;let qty=1;
const im=p.imgs.map(img);
$('#pdWrap').innerHTML=`<div class="container"><div class="row g-4 g-lg-5">
<div class="col-lg-6"><div class="gal-main swiper" id="gMain"><button class="zoom-tip" id="zt"><i class="fa-solid fa-magnifying-glass-plus me-1"></i>Zoom</button><div class="swiper-wrapper">${im.map(s=>`<div class="swiper-slide"><img src="${s}" alt="${p.name}"></div>`).join('')}</div><div class="swiper-button-prev"></div><div class="swiper-button-next"></div><div class="swiper-pagination"></div></div>
<div class="gal-thumbs swiper" id="gThumbs"><div class="swiper-wrapper">${im.map(s=>`<div class="swiper-slide"><img src="${s}" alt=""></div>`).join('')}</div></div></div>
<div class="col-lg-6 pd"><h1>${p.name}</h1><div class="prate mt-2"><span class="rbox">${p.rating} <i class="fa-solid fa-star"></i></span><small>${p.reviews} ratings</small>${p.badge?`<span class="pbadge position-static ms-2">${p.badge}</span>`:''}</div>
<div class="price"><b>${inr(p.price)}</b><s>${inr(p.mrp)}</s><em>${off(p)}% off</em></div><small class="text-muted">Inclusive of all taxes</small>
<p class="mt-3">${p.short}</p>
<div class="d-flex align-items-center gap-3 mb-3"><b>Quantity</b><div class="qty"><button id="qm" aria-label="Decrease"><i class="fa-solid fa-minus"></i></button><span id="qv">1</span><button id="qp" aria-label="Increase"><i class="fa-solid fa-plus"></i></button></div></div>
<div class="buybar sticky-m"><button class="btn btn-ghost" id="addB"><i class="fa-solid fa-cart-plus me-2"></i>Add to Cart</button><button class="btn btn-flame" id="buyB"><i class="fa-solid fa-bolt me-2"></i>Buy Now</button></div>
<a class="btn btn-wa w-100 mt-3" target="_blank" rel="noopener" href="https://wa.me/${SITE.whatsapp}?text=${encodeURIComponent('Hello, I want to enquire about: '+p.name+' ('+inr(p.price)+')')}"><i class="fa-brands fa-whatsapp me-2"></i>Enquire on WhatsApp</a>
<div class="perks"><div><i class="fa-solid fa-shield-halved"></i>1 Year Warranty</div><div><i class="fa-solid fa-truck-fast"></i>Fast Delivery</div><div><i class="fa-solid fa-certificate"></i>100% Genuine</div></div></div></div>
<div class="mt-5 tabs-me"><ul class="nav nav-tabs" role="tablist"><li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#t1">Description</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#t2">Specifications</button></li></ul>
<div class="tab-content pt-3"><div class="tab-pane fade show active" id="t1"><p style="max-width:760px">${p.desc}</p></div>
<div class="tab-pane fade" id="t2"><table class="spec-t">${Object.entries(p.specs).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table></div></div></div></div>`;
const th=new Swiper('#gThumbs',{slidesPerView:4.2,spaceBetween:10,watchSlidesProgress:true,breakpoints:{576:{slidesPerView:5}}});
const mn=new Swiper('#gMain',{loop:false,autoplay:{delay:3200,disableOnInteraction:true,pauseOnMouseEnter:true},speed:600,navigation:{nextEl:'#gMain .swiper-button-next',prevEl:'#gMain .swiper-button-prev'},pagination:{el:'#gMain .swiper-pagination',clickable:true},thumbs:{swiper:th}});
mn.on('click',s=>{Lightbox.open(im,s.clickedIndex??s.activeIndex)});$('#zt').onclick=e=>{e.stopPropagation();Lightbox.open(im,mn.activeIndex)};
const sv=()=>$('#qv').textContent=qty;$('#qm').onclick=()=>{qty=Math.max(1,qty-1);sv()};$('#qp').onclick=()=>{qty=Math.min(99,qty+1);sv()};
$('#addB').onclick=()=>{Cart.add(p.id,qty);toast(qty+' item(s) added to cart')};
$('#buyB').onclick=()=>{Cart.add(p.id,qty);location.href='cart.html'};
$('#rel').innerHTML=PRODUCTS.filter(x=>x.id!==p.id&&x.cat===p.cat).concat(PRODUCTS.filter(x=>x.id!==p.id&&x.cat!==p.cat)).slice(0,4).map(card).join('');
}
</script></body></html>
